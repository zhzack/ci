services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mini_pipeline
      POSTGRES_USER: mini_pipeline
      POSTGRES_PASSWORD: mini_pipeline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_pipeline"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      MINI_PIPELINE_CONFIG: /app/config/docker.yaml
      DATABASE_URL: postgresql+psycopg://mini_pipeline:mini_pipeline@database:5432/mini_pipeline
      # Token auth (see .env.example); docker.yaml refuses to start without them.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MINI_PIPELINE_ADMIN_TOKEN: ${MINI_PIPELINE_ADMIN_TOKEN:?set MINI_PIPELINE_ADMIN_TOKEN in .env}
      MINI_PIPELINE_READER_TOKEN: ${MINI_PIPELINE_READER_TOKEN:?set MINI_PIPELINE_READER_TOKEN in .env}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - pipeline-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  pipeline-data:
