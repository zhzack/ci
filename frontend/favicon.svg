<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1629"/>
      <stop offset="100%" style="stop-color:#0d1f3c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#1677ff"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Pipeline DAG: 3 nodes, 3 connecting edges -->
  <!-- Top node -->
  <circle cx="32" cy="14" r="4" fill="url(#glow)" opacity="0.95"/>
  <!-- Bottom-left node -->
  <circle cx="14" cy="50" r="4" fill="url(#glow)" opacity="0.95"/>
  <!-- Bottom-right node -->
  <circle cx="50" cy="50" r="4" fill="url(#glow)" opacity="0.95"/>
  <!-- Edge: top → bottom-left -->
  <line x1="29" y1="17" x2="17" y2="47" stroke="url(#glow)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Edge: top → bottom-right -->
  <line x1="35" y1="17" x2="47" y2="47" stroke="url(#glow)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Edge: bottom-left → bottom-right (cross link) -->
  <line x1="18" y1="50" x2="46" y2="50" stroke="url(#glow)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Middle node on the cross-link -->
  <circle cx="32" cy="36" r="3" fill="url(#glow)" opacity="0.75"/>
  <!-- Connecting top to middle -->
  <line x1="32" y1="18" x2="32" y2="33" stroke="url(#glow)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.5"/>
</svg>
