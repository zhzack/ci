name: chain-math
params:
  a: 2
  b: 3
  c: 4
steps:
  - name: math
    plugin: math-divprod@1.0.0
    with:
      a: "${{ params.a }}"
      b: "${{ params.b }}"
      c: "${{ params.c }}"
  - name: rank
    plugin: rank-list@1.0.0
    depends: [math]
    with:
      x: "${{ params.a }}"
      y: "${{ params.b }}"
      z: "${{ params.c }}"
      quotient: "${{ steps.math.outputs.quotient }}"
