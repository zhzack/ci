name: report-builder
version: 1.0.0
description: Build a Markdown report from upstream statistics (v2 contract).
runtime:
  type: shell
  entry: run.sh
contract:
  inputs:
    - name: title
      type: string
      source: parameter
      required: true
      target: title
    - name: subtitle
      type: string
      source: parameter
      required: false
      default: ""
      target: subtitle
    - name: count
      type: number
      source: parameter
      required: true
      target: count
    - name: sum
      type: number
      source: parameter
      required: true
      target: sum
    - name: avg
      type: number
      source: parameter
      required: true
      target: avg
    - name: max
      type: number
      source: parameter
      required: true
      target: max
    - name: min
      type: number
      source: parameter
      required: true
      target: min
  outputs:
    - name: report
      type: string
      path: output/report.md
    - name: word_count
      type: integer
      path: output/word_count.json
