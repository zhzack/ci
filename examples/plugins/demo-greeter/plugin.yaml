name: demo-greeter
version: 1.0.0
description: Generate a random greeting and emit it as a text artifact
runtime:
  type: shell
entry: run.sh
inputs:
  greeting:
    type: string
    required: true
    description: Base greeting word
  seed:
    type: integer
    required: false
    default: 42
    description: RNG seed for reproducible randomness
outputs:
  message:
    type: string
    description: Final greeting line
  word_count:
    type: integer
    description: Number of words in the final line
