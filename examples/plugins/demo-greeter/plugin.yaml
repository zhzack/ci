name: demo-greeter
version: 1.0.0
description: Generate a random greeting and save it as an artifact.
runtime:
  type: shell
  entry: run.sh
contract:
  inputs:
    - name: greeting
      type: string
      source: parameter
      required: true
      target: greeting
    - name: seed
      type: integer
      source: parameter
      required: false
      default: 42
      target: seed
  outputs:
    - name: message
      type: string
      path: output/message.txt
    - name: word_count
      type: integer
      path: output/word_count.json
