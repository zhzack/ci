name: rank-list
version: 1.0.0
description: Sort four numeric values in descending order.
runtime:
  type: shell
  entry: run.sh
contract:
  inputs:
    - name: x
      type: number
      source: parameter
      required: true
      target: x
    - name: y
      type: number
      source: parameter
      required: true
      target: y
    - name: z
      type: number
      source: parameter
      required: true
      target: z
    - name: quotient
      type: number
      source: parameter
      required: false
      default: 0
      target: quotient
  outputs:
    - name: ranked
      type: list
      path: output/ranked.json
    - name: max
      type: number
      path: output/max.json
    - name: min
      type: number
      path: output/min.json
