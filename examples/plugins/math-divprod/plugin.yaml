name: math-divprod
version: 1.0.0
description: Compute a*b and (a*b)/c with division-by-zero handling.
runtime:
  type: shell
  entry: run.sh
contract:
  inputs:
    - name: a
      type: number
      source: parameter
      required: true
      target: a
    - name: b
      type: number
      source: parameter
      required: true
      target: b
    - name: c
      type: number
      source: parameter
      required: true
      target: c
  outputs:
    - name: product
      type: number
      path: output/product.json
    - name: quotient
      type: number
      path: output/quotient.json
