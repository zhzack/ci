[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-pipeline"
version = "0.3.0"
description = "A lightweight and extensible pipeline execution platform"
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.20,<1",
    "alembic>=1.13,<2",
    "cryptography>=42,<46",
    "paramiko>=3.4,<4",
    "PySocks>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
mini-pipeline = "mini_pipeline.server.main:run"
mini-pipeline-gc = "mini_pipeline.maintenance.gc:main"
mini-pipeline-runner = "mini_pipeline.runner.agent:main"

[tool.setuptools.packages.find]
include = ["mini_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "UP045"]
