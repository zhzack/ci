app:
  name: Mini Pipeline
  host: 0.0.0.0
  port: 8000
  api_prefix: /api

database:
  url: sqlite:///./data/mini_pipeline.db
  echo: false

storage:
  root: ./data
  plugins: ./data/plugins
  workspaces: ./data/workspaces
  logs: ./data/logs
  artifacts: ./data/artifacts
  temp: ./data/tmp

execution:
  coordinator_workers: 2
  task_workers: 4
  task_timeout_seconds: 3600
  # Mark runs stuck in PENDING/RUNNING at startup as FAILED (crash recovery).
  reap_orphans_on_start: true
  # Base delay for step retries; doubles per attempt, capped at 60s.
  retry_backoff_seconds: 2

logging:
  # text (console friendly) | json (log-collector friendly)
  level: INFO
  format: text

observability:
  # Expose GET /metrics in Prometheus text format.
  metrics_enabled: true

auth:
  # Enable multi-user authentication by default.
  enabled: true
  tokens: []
  # tokens:
  #   - token: <secret>          # e.g. ${MINI_PIPELINE_ADMIN_TOKEN}
  #     name: ci-bot
  #     role: admin             # admin | reader

security:
  # CORS origins allowed to call the API from a browser. Empty = no CORS.
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
  # Max mutating (POST/PUT/PATCH/DELETE) requests per client IP per minute.
  # 0 disables rate limiting.
  rate_limit_per_minute: 0
  # Encrypts machine credentials at rest; set when using admin machines.
  secret_key: "dev-secret-key-32-chars-long-min!"

retention:
  # Days to keep per-run data after the run finishes. 0 = keep forever.
  workspaces_days: 14
  logs_days: 30
  artifacts_days: 90
  temp_hours: 24

runner:
  # Remote execution (runner agents). A claimed task must heartbeat within
  # lease_seconds or it is marked FAILED by the lease reaper.
  lease_seconds: 120
  heartbeat_interval_seconds: 15
  offline_after_seconds: 45
  poll_interval_seconds: 0.5

sources:
  http_timeout_seconds: 30
  max_archive_bytes: 104857600
  max_extracted_bytes: 524288000
  max_archive_files: 10000

packages:
  # Storage driver for user uploaded packages, plugins, scripts, and assets.
  # Options: local | s3
  driver: local
  local:
    root: ./data/packages
  s3:
    endpoint_url: null
    bucket_name: mini-pipeline
    access_key: null
    secret_key: null
    region: us-east-1

email:
  enabled: true
  host: smtp.qq.com
  port: 465
  username: "1018784543@qq.com"
  password: "jnkepakmmszlbeij"
  sender_email: "1018784543@qq.com"
  sender_name: "Mini Pipeline CI/CD"
  use_ssl: true
  use_tls: false

artifact_storage:
  # Storage backend for pipeline run artifacts. Options: local | s3.
  # With s3, artifacts live in the bucket below (S3/MinIO/OSS/COS/R2) and
  # survive server restarts instead of being bound to local disk.
  driver: local
  prefix: artifacts
  s3:
    endpoint_url: null
    bucket_name: mini-pipeline
    access_key: null
    secret_key: null
    region: us-east-1


