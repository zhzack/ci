name: CI

on:
  push:
    branches: [main, glm_test]
  pull_request:

# One run per branch: a new push cancels the superseded run instead of queuing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: this pipeline never pushes anything back.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
      - name: Lint (ruff)
        run: ruff check .
      - name: Test with coverage
        env:
          MINI_PIPELINE_CONFIG: config/default.yaml
        run: pytest -q --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      - name: Production build
        run: npm run build
